name: Build and Push to GHCR

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Java app image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/ayushsharma0209/upi-transaction:latest
            ghcr.io/ayushsharma0209/upi-transaction:${{ github.sha }}

      - name: Build and push agent-bot image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: agent/Dockerfile
          push: true
          tags: |
            ghcr.io/ayushsharma0209/upi-agent-bot:latest
            ghcr.io/ayushsharma0209/upi-agent-bot:${{ github.sha }}